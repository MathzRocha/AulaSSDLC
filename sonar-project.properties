# Configuração do SonarScanner para o lab (lida automaticamente pelo scanner)
# Token e URL vêm das variáveis de ambiente SONAR_TOKEN / SONAR_HOST_URL
sonar.projectKey=lab-inseguro
sonar.projectName=Lab Inseguro
sonar.projectVersion=1.0
sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.exclusions=node_modules/**,vendor/**,reports/**,scans/**,lab.sqlite,**/*.lock,package-lock.json
